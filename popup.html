<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Obligations Modifier</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0e1116;
      color: #e6edf3;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0;
    }
    .status {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #21262d;
      color: #8b949e;
    }
    .status.on {
      background: #1f6f43;
      color: #d2f8df;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button.primary {
      background: #2da44e;
      color: white;
    }
    button.primary.on {
      background: #cf222e;
    }
    button.primary:hover {
      filter: brightness(1.08);
    }
    button.secondary {
      background: #21262d;
      color: #e6edf3;
      margin-top: 8px;
    }
    button.secondary:hover {
      background: #30363d;
    }
    label {
      font-size: 12px;
      color: #8b949e;
      display: block;
      margin: 12px 0 6px;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 120px;
      background: #0b0e13;
      color: #d2d9e0;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      resize: vertical;
    }
    .hint {
      font-size: 11px;
      color: #8b949e;
      margin-top: 8px;
      line-height: 1.4;
    }
    .endpoint {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: #79c0ff;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>Obligations Response Modifier</h1>

  <div class="row">
    <span>Statut</span>
    <span id="status" class="status">Inactif</span>
  </div>

  <button id="toggle" class="primary">Activer la modification</button>

  <label for="endpoint">Endpoint cible</label>
  <div class="endpoint">/api/accounts/v1/accounts/customer-details/obligations</div>

  <label for="payload">Reponse a injecter (JSON)</label>
  <textarea id="payload" spellcheck="false"></textarea>

  <button id="reset" class="secondary">Reinitialiser la reponse par defaut</button>

  <p class="hint">
    Cliquez sur "Activer" puis rechargez la page Starlink.
    La reponse de l&apos;endpoint sera remplacee par le JSON ci-dessus.
  </p>

  <script src="popup.js"></script>
</body>
</html>
